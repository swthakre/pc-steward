name: Bug report
description: Report a reproducible problem in PC Steward
body:
  - type: markdown
    attributes:
      value: "Do not attach sensitive paths, scan reports, credentials or security exploit details. See SECURITY.md for vulnerabilities."
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Prefer a small synthetic file fixture.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows version and PC Steward commit/version
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
